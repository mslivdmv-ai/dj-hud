<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>DG HUD</title>

<link rel="stylesheet" href="style.css">

<script defer src="script.js"></script>

</head>

<body>

<!-- Compass -->

<div id="compass">

    <span id="heading">N</span>

    <span id="degrees">000°</span>

    <span id="street">Power Street</span>

</div>

<!-- Top Right -->

<div id="topRight">

    <img id="logo" src="assets/logo.png">

    <div class="smallPanel">

        <div class="row">

            <span>TIME</span>

            <span id="time">11:42 PM</span>

        </div>

        <div class="row">

            <span>PLAYERS</span>

            <span id="players">32/128</span>

        </div>

        <div class="row">

            <span>ID</span>

            <span id="playerid">1</span>

        </div>

    </div>

    <div class="moneyPanel">

        <div class="row">

            <span>Cash</span>

            <span id="cash">$0</span>

        </div>

        <div class="row">

            <span>Bank</span>

            <span id="bank">$0</span>

        </div>

        <div class="row">

            <span>Dirty</span>

            <span id="dirty">$0</span>

        </div>

    </div>

    <div class="jobPanel">

        <div id="job">

            Police

        </div>

        <div id="duty">

            On Duty

        </div>

    </div>

</div>

<!-- Left Bottom -->

<div id="leftHud">

    <div id="voiceRow">

        <div class="voiceBubble">

            🎤

        </div>

        <div class="voiceBubble">

            📻

        </div>

    </div>

    <div id="circleMap">

        <div id="mapMask"></div>

    </div>

    <div id="statusCircles">

        <div class="statusCircle" id="healthCircle">

            ❤

        </div>

        <div class="statusCircle" id="armorCircle">

            🛡

        </div>

        <div class="statusCircle" id="hungerCircle">

            🍔

        </div>

        <div class="statusCircle" id="thirstCircle">

            💧

        </div>

        <div class="statusCircle" id="stressCircle">

            🧠

        </div>

        <div class="statusCircle" id="staminaCircle">

            🏃

        </div>

    </div>

    <div id="location">

        <div id="zone">

            Legion Square

        </div>

        <div id="road">

            Power Street

        </div>

    </div>

</div>

<!-- Vehicle HUD -->

<div id="vehicleHud">

    <div id="speedCircle">

        <div id="speed">

            0

        </div>

        <div id="mph">

            MPH

        </div>

    </div>

    <div id="vehicleInfo">

        <div>

            Fuel

            <span id="fuel">

                100%

            </span>

        </div>

        <div>

            Engine

            <span id="engine">

                100%

            </span>

        </div>

    </div>

    <div id="vehicleIcons">

        <div id="seatbelt">

            🔒

        </div>

        <div id="lights">

            💡

        </div>

        <div id="cruise">

            🚗

        </div>

        <div id="lock">

            🔐

        </div>

    </div>

</div>

</body>

</html>
